# Sando Pulse — Roadmap 1 stack.
# Authored for a real Docker host (Dominic's machine / production).
# Only the API port (9000) is published; everything else talks on the
# internal pulse-net network. Dev-only ports (Grafana 3000, Prometheus 9090,
# MinIO console 9001) are commented out below — uncomment for local dev.
# Secrets come from the environment / a gitignored .env file — NEVER from
# this file. Copy .env.example to .env and fill it in.

# Log rotation for every service (Roadmap 5.4): json-file driver, 10 MB
# per file, 3 files kept. Without this a long-running container fills
# the host disk with logs.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: pulse-api:0.1.0
    command: ["serve"]
    environment:
      PULSE_HOST: "0.0.0.0"
      PULSE_PORT: "9000"
      PULSE_API_KEY: "${PULSE_API_KEY:-}"
      PULSE_API_KEY_PREVIOUS: "${PULSE_API_KEY_PREVIOUS:-}"
      PULSE_CONSUMERS: "${PULSE_CONSUMERS:-}"
      PULSE_AUDIT_LOG: "${PULSE_AUDIT_LOG:-}"
      PULSE_BEHIND_TLS_PROXY: "${PULSE_BEHIND_TLS_PROXY:-1}"
      PULSE_LOG_LEVEL: "${PULSE_LOG_LEVEL:-info}"
      DATABASE_URL: "postgres://pulse:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/pulse"
      REDIS_URL: "redis://redis:6379"
      MINIO_ENDPOINT: "http://minio:9000"
      MINIO_ACCESS_KEY: "${MINIO_ACCESS_KEY:?set MINIO_ACCESS_KEY in .env}"
      MINIO_SECRET_KEY: "${MINIO_SECRET_KEY:?set MINIO_SECRET_KEY in .env}"
      MINIO_BUCKET: "pulse-raw"
    ports:
      - "9000:9000"
    volumes:
      - pulse-backups:/app/backups
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    logging: *default-logging
    networks:
      - pulse-net
    restart: unless-stopped

  # Second API instance + load balancer (Roadmap 6.9): only with the
  # `scale` profile. api-2 is api with no published port; lb (nginx)
  # fronts both on host 9080. The API is stateless except L1 (see
  # docs/SCALABILITY.md — statelessness contract), so either instance
  # can serve any request; a query cached on api is not on api-2, but
  # the shared Redis L2 covers it. Start with:
  #   docker compose --profile scale up -d
  # Then point clients at the LB (9080 here; in production give the LB
  # port 9000 and drop the api services' host mappings).
  api-2:
    profiles: ["scale"]
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: pulse-api:0.1.0
    command: ["serve"]
    environment:
      PULSE_HOST: "0.0.0.0"
      PULSE_PORT: "9000"
      PULSE_API_KEY: <redacted>
      PULSE_API_KEY_PREVIOUS: "${PULSE_API_KEY_PREVIOUS:-}"
      PULSE_CONSUMERS: "${PULSE_CONSUMERS:-}"
      PULSE_AUDIT_LOG: "${PULSE_AUDIT_LOG:-}"
      PULSE_BEHIND_TLS_PROXY: "${PULSE_BEHIND_TLS_PROXY:-1}"
      PULSE_LOG_LEVEL: "${PULSE_LOG_LEVEL:-info}"
      DATABASE_URL: <redacted>
      REDIS_URL: "redis://redis:6379"
      MINIO_ENDPOINT: "http://minio:9000"
      MINIO_ACCESS_KEY: "${MINIO_ACCESS_KEY:?set MINIO_ACCESS_KEY in .env}"
      MINIO_SECRET_KEY: "${MINIO_SECRET_KEY:?set MINIO_SECRET_KEY in .env}"
      MINIO_BUCKET: "pulse-raw"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    logging: *default-logging
    networks:
      - pulse-net
    restart: unless-stopped

  lb:
    profiles: ["scale"]
    image: nginx:1.27-alpine
    ports:
      - "9080:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - api-2
    logging: *default-logging
    networks:
      - pulse-net
    restart: unless-stopped

  worker:
    image: pulse-api:0.1.0
    command: ["worker"]
    environment:
      PULSE_HOST: "0.0.0.0"
      PULSE_PORT: "9000"
      PULSE_API_KEY: "${PULSE_API_KEY:-}"
      PULSE_LOG_LEVEL: "${PULSE_LOG_LEVEL:-info}"
      PULSE_INGEST_INTERVAL_S: "${PULSE_INGEST_INTERVAL_S:-300}"
      PULSE_WORKER_ID: "${PULSE_WORKER_ID:-worker-1}"
      DATABASE_URL: "postgres://pulse:${POSTGRES_PASSWORD}@postgres:5432/pulse"
      REDIS_URL: "redis://redis:6379"
      MINIO_ENDPOINT: "http://minio:9000"
      MINIO_ACCESS_KEY: "${MINIO_ACCESS_KEY}"
      MINIO_SECRET_KEY: "${MINIO_SECRET_KEY}"
      MINIO_BUCKET: "pulse-raw"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    logging: *default-logging
    networks:
      - pulse-net
    restart: unless-stopped

  # Second worker (Roadmap 5.4): same code, distinct PULSE_WORKER_ID so
  # the two workers are separate Redis Streams consumers and split the
  # realtime work. Start with: docker compose --profile scale up -d
  worker-2:
    profiles: ["scale"]
    image: pulse-api:0.1.0
    command: ["worker"]
    environment:
      PULSE_LOG_LEVEL: "${PULSE_LOG_LEVEL:-info}"
      PULSE_INGEST_INTERVAL_S: "${PULSE_INGEST_INTERVAL_S:-300}"
      PULSE_WORKER_ID: "worker-2"
      DATABASE_URL: "postgres://pulse:${POSTGRES_PASSWORD}@postgres:5432/pulse"
      REDIS_URL: "redis://redis:6379"
      MINIO_ENDPOINT: "http://minio:9000"
      MINIO_ACCESS_KEY: "${MINIO_ACCESS_KEY}"
      MINIO_SECRET_KEY: "${MINIO_SECRET_KEY}"
      MINIO_BUCKET: "pulse-raw"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    logging: *default-logging
    networks:
      - pulse-net
    restart: unless-stopped

  # One-shot backup (Roadmap 5.4): runs `pulse backup` and exits.
  # Run with: docker compose --profile backup run --rm backup
  # The backup lands in the pulse-backups volume (/app/backups).
  backup:
    profiles: ["backup"]
    image: pulse-api:0.1.0
    command: ["backup"]
    environment:
      DATABASE_URL: "postgres://pulse:${POSTGRES_PASSWORD}@postgres:5432/pulse"
    volumes:
      - pulse-backups:/app/backups
    depends_on:
      postgres:
        condition: service_healthy
    logging: *default-logging
    networks:
      - pulse-net

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pulse
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}"
      POSTGRES_DB: pulse
    volumes:
      - pulse-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulse -d pulse"]
      interval: 5s
      timeout: 3s
      retries: 12
    logging: *default-logging
    networks:
      - pulse-net
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - pulse-redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    logging: *default-logging
    networks:
      - pulse-net
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: "${MINIO_ACCESS_KEY:?set MINIO_ACCESS_KEY in .env}"
      MINIO_ROOT_PASSWORD: "${MINIO_SECRET_KEY:?set MINIO_SECRET_KEY in .env}"
    volumes:
      - pulse-miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 12
    logging: *default-logging
    networks:
      - pulse-net
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - pulse-promdata:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    # Dev only: uncomment to reach Prometheus directly.
    # ports:
    #   - "9090:9090"
    depends_on:
      - api
      - postgres-exporter
      - redis-exporter
      - node-exporter
    logging: *default-logging
    networks:
      - pulse-net
    restart: unless-stopped

  # Host resource metrics (Roadmap 5.4): CPU, memory, disk, network.
  node-exporter:
    image: prom/node-exporter:latest
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    logging: *default-logging
    networks:
      - pulse-net
    restart: unless-stopped

  # Alertmanager (Roadmap 5.4): only started with the alerts profile.
  # Configure a real receiver in docker/alertmanager/alertmanager.yml
  # (email/Slack/webhook) before enabling it — the shipped config sends
  # alerts nowhere.
  #   docker compose --profile alerts up -d
  alertmanager:
    profiles: ["alerts"]
    image: prom/alertmanager:latest
    volumes:
      - ./docker/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    logging: *default-logging
    networks:
      - pulse-net
    restart: unless-stopped

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    environment:
      DATA_SOURCE_NAME: "postgresql://pulse:${POSTGRES_PASSWORD}@postgres:5432/pulse?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy
    logging: *default-logging
    networks:
      - pulse-net
    restart: unless-stopped

  redis-exporter:
    image: oliver006/redis_exporter:latest
    environment:
      REDIS_ADDR: "redis://redis:6379"
    depends_on:
      redis:
        condition: service_healthy
    logging: *default-logging
    networks:
      - pulse-net
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    environment:
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env for grafana}"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/etc/grafana/dashboards:ro
      - pulse-grafanadata:/var/lib/grafana
    # Dev only: uncomment to reach Grafana directly.
    # ports:
    #   - "3000:3000"
    depends_on:
      - prometheus
    logging: *default-logging
    networks:
      - pulse-net
    restart: unless-stopped

volumes:
  pulse-backups:
  pulse-pgdata:
  pulse-redisdata:
  pulse-miniodata:
  pulse-promdata:
  pulse-grafanadata:

networks:
  pulse-net:
    driver: bridge
