# Sando Pulse — load balancer for the scaled API (Roadmap 6.9).
# Only used with: docker compose --profile scale up -d
# It fronts api:9000 + api-2:9000 (round-robin) and publishes 9080
# on the host. In production give the LB port 9000 and drop the api
# services' host port mappings. Never run on the build VM (podman
# --network none); validate on a real Docker host.
# Honest limit: open-source nginx has no active health checks — a
# dead backend is skipped only after a failed request, not
# proactively. The /v1/health location exists so an external monitor
# (or the Prometheus blackbox prober) can check each backend.
events {}

http {
    upstream pulse_api {
        server api:9000;
        server api-2:9000;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://pulse_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }
    }
}
