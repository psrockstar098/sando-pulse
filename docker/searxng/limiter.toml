# SearXNG bot-detection overrides for Sando Pulse (docs/WEBSEARCH.md).
#
# The only client of this instance is the Pulse API, on the compose
# network (172.16.0.0/12, Docker's default range) or localhost in dev.
# Those IPs are passlisted so the API's own searches are never
# throttled; the limiter still guards the web UI (if the port is ever
# published for local dev) against bots. Everything else keeps the
# image defaults — only what Pulse needs is overridden here.
[botdetection.ip_lists]
pass_ip = [
  '127.0.0.0/8',
  '::1',
  '172.16.0.0/12',
]
