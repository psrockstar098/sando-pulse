openapi: 3.0.3
info:
  title: Sando Pulse API
  version: "1"
  description: |
    Liberia-first intelligence and search engine. All responses are JSON
    (except the Facebook webhook verification, which is plain text).
    All JSON responses carry the `x-pulse-api-version: 1` header and
    a `request_id` field.

    Answers are extractive and evidence-grounded: `sufficient: false`
    means Pulse has no evidence and says so, rather than inventing an
    answer. See docs/API.md for the full guide and
    docs/SANDO_INTEGRATION.md for the Sando client contract.
servers:
  - url: http://127.0.0.1:9000
    description: Local development server
  - url: https://sando-pulse.onrender.com
    description: Live production (Render, single all-in-one service, since 2026-11-17)
tags:
  - name: query
    description: Ask questions
  - name: webhooks
    description: Facebook webhook verification and receiver
security:
  - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: API key
      description: |
        Pulse API key (PULSE_API_KEY). In open dev mode (no key
        configured) the header is not required. Send
        `X-Pulse-Consumer: <name>` to identify the consumer; unknown
        names are rejected with 401 when consumers are configured.
  parameters:
    RequestIdHeader:
      name: x-request-id
      in: header
      description: Echoed in every JSON response body as `request_id`.
      schema:
        type: string
    ApiVersionHeader:
      name: x-pulse-api-version
      in: header
      description: Always `1` on JSON responses.
      schema:
        type: string
        enum: ["1"]
    ConsumerHeader:
      name: X-Pulse-Consumer
      in: header
      description: Registered consumer name (PULSE_CONSUMERS). Defaults to `default`.
      schema:
        type: string
        example: sando
  responses:
    BadRequest:
      description: The request was malformed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Missing/invalid API key, or unknown consumer.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: The consumer lacks the scope for this endpoint.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: No such route, or no such event id.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    RateLimited:
      description: Per-minute/per-day rate limit or per-consumer daily quota spent.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ServerError:
      description: Pulse failed to serve the request.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Error:
      type: object
      required: [error, code, message, request_id]
      properties:
        error:
          type: string
          example: rate_limited
        code:
          type: string
          example: rate_limited
        message:
          type: string
          example: Rate limit exceeded
        request_id:
          type: string
    QueryRequest:
      type: object
      required: [query]
      properties:
        query:
          type: string
          minLength: 1
          maxLength: 1000
          example: fuel shortage in Monrovia
        options:
          type: object
          properties:
            limit:
              type: integer
              minimum: 1
              maximum: 20
              default: 10
        context:
          type: object
          description: Forward-compatibility context; ignored by the server today. County is folded into the query text instead.
          properties:
            county:
              type: string
              example: Montserrado
            language:
              type: string
              example: koloqua
    Citation:
      type: object
      properties:
        title:
          type: string
        summary:
          type: string
          description: Extractive summary, max 280 chars.
        url:
          type: string
          format: uri
        kind:
          type: string
          enum: [local, social]
          description: "local = RSS document from the registered feeds; social = Facebook post collected by the worker (source_id starting facebook:)."
        source:
          type: object
          properties:
            name:
              type: string
            url:
              type: string
              format: uri
        published_at:
          type: string
          format: date-time
          nullable: true
        score:
          type: number
    QueryResponse:
      type: object
      required: [query, sufficient, confidence, results]
      properties:
        query:
          type: string
        answer:
          type: string
          nullable: true
          description: Extractive answer grounded in `results`; null when insufficient.
        sufficient:
          type: boolean
        insufficient_reason:
          type: string
          nullable: true
          example: no_documents_matched
        confidence:
          type: number
          minimum: 0
          maximum: 1
        results:
          type: array
          items:
            $ref: "#/components/schemas/Citation"
        unified:
          type: object
          nullable: true
          description: |
            The unified fan-out (one query, three legs). Null for stat
            answers, which do not fan out. `web` holds the web results
            in SearXNG's order, deduplicated against the local results
            by normalized URL. `web_complete` says whether the web leg
            finished before the answer was sent. `sources` cites each
            leg: local (ok), web (ok / unavailable / timeout / error),
            facebook (configured / not_configured). The web leg waits
            at most PULSE_WEB_TIMEOUT_MS (default 1500 ms).
          properties:
            web:
              type: array
              items:
                type: object
                properties:
                  title:
                    type: string
                  summary:
                    type: string
                  url:
                    type: string
                    format: uri
                  engine:
                    type: string
                    example: brave
                  source:
                    type: object
                    properties:
                      name:
                        type: string
                      url:
                        type: string
                        format: uri
            web_complete:
              type: boolean
            sources:
              type: array
              items:
                type: object
                properties:
                  name:
                    type: string
                    enum: [local, web, facebook]
                  status:
                    type: string
                    example: ok
                  results:
                    type: integer
                  detail:
                    type: string
                    nullable: true
        fanout_complete:
          type: boolean
          description: False when a backend was still running when the answer was sent.
        events:
          type: array
          items:
            type: object
        timeline:
          type: array
          items:
            type: object
        path:
          type: string
          enum: [instant, fast, deep]
          description: "Execution path that served this response (Roadmap 6.1): instant = L1/L2 cache hit only; fast = memindex shortlist + store search; deep = research/compare/historical intents, whole candidate set + fuzzy second pass."
        latency_ms:
          type: number
          description: Measured server-side latency in milliseconds (fractional). Client-measured latency is higher (connection + the ~42 ms per-request floor on the dev VM — see docs/PERFORMANCE.md).
        routing_reason:
          type: string
          description: Why the router chose this path (e.g. l1_hit, l2_hit, default_fast, intent_deep, strategy_deep, semantic_only, stat_answer).
        stat_answer:
          type: object
          nullable: true
          description: |
            Stat answer (Roadmap 7.2), present only when the query
            is a statistics question answered from the knowledge
            store: kind (facility_count | population), sufficient,
            answer_text, value, unit, period, rows_counted, source,
            verified_at, insufficient_reason. Unknown places or
            facilities answer sufficient false — never a guessed number.
          properties:
            kind:
              type: string
            sufficient:
              type: boolean
            answer_text:
              type: string
              nullable: true
            value:
              type: number
              nullable: true
            unit:
              type: string
              nullable: true
            period:
              type: string
              nullable: true
            rows_counted:
              type: integer
            source:
              type: string
              nullable: true
            verified_at:
              type: string
              nullable: true
            insufficient_reason:
              type: string
              nullable: true
        query_plan:
          type: object
          properties:
            intent:
              type: string
            topics:
              type: array
              items:
                type: string
            counties:
              type: array
              items:
                type: string
            strategy:
              type: string
            classification_confidence:
              type: number
        meta:
          type: object
          properties:
            request_id:
              type: string
            results_count:
              type: integer
            sources_checked:
              type: integer
            generated_at:
              type: string
              format: date-time
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          example: ok
        version:
          type: string
          example: "0.1.0"
        api_version:
          type: string
          example: "1"
        country:
          type: string
          example: lr
          description: Deployment country (PULSE_COUNTRY, ISO 3166-1 alpha-2).
        documents:
          type: integer
        sources_enabled:
          type: integer
        store:
          type: string
          enum: [memory, postgres]
        request_id:
          type: string
paths:
  /v1/health:
    get:
      tags: [query]
      summary: Health check (no auth)
      responses:
        "200":
          description: Pulse is up.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /v1/query:
    post:
      tags: [query]
      summary: Ask a question (auth + rate limit + quota, scope `query`) — the one public search surface; fans out in parallel to the local index, the web (SearXNG, bundled) and Facebook/social when configured, and returns one ranked list with a top-level `unified` object citing each leg
      parameters:
        - $ref: "#/components/parameters/ConsumerHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QueryRequest"
      responses:
        "200":
          description: "Answer (possibly an honest refusal: sufficient is false)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueryResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"
  /v1/webhooks/facebook:
    get:
      tags: [webhooks]
      summary: Meta subscription handshake (no API-key auth; verify token instead)
      description: |
        Meta GETs `?hub.mode=subscribe&hub.verify_token=...&hub.challenge=...`.
        Pulse echoes `hub.challenge` only when the token matches
        PULSE_FACEBOOK_VERIFY_TOKEN.
      parameters:
        - name: hub.mode
          in: query
          schema:
            type: string
        - name: hub.verify_token
          in: query
          schema:
            type: string
        - name: hub.challenge
          in: query
          schema:
            type: string
      responses:
        "200":
          description: The challenge string, plain text.
          content:
            text/plain:
              schema:
                type: string
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [webhooks]
      summary: Facebook webhook receiver (HMAC signature is the auth)
      description: |
        Requires `X-Hub-Signature-256` validated against
        PULSE_FACEBOOK_APP_SECRET. Validated notifications are recorded
        for the worker; the response counts received vs recorded.
      responses:
        "200":
          description: Received/recorded counts.
          content:
            application/json:
              schema:
                type: object
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          description: Webhooks not configured (no app secret).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
