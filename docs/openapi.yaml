openapi: 3.0.3
info:
  title: Sando Pulse API
  version: "1"
  description: |
    Liberia-first intelligence and search engine. All responses are JSON
    (except /metrics, which is Prometheus text, and the Facebook webhook
    verification, which is plain text). All JSON responses carry the
    `x-pulse-api-version: 1` header and a `request_id` field.

    Answers are extractive and evidence-grounded: `sufficient: false`
    means Pulse has no evidence and says so, rather than inventing an
    answer. See docs/API.md for the full guide and
    docs/SANDO_INTEGRATION.md for the Sando client contract.
servers:
  - url: http://127.0.0.1:9000
    description: Local development server
  - url: https://pulse.example.invalid
    description: Production (behind a TLS-terminating reverse proxy)
tags:
  - name: query
    description: Ask questions and ingest documents
  - name: intelligence
    description: Trends, briefings, events, locations, statistics, quality
  - name: admin
    description: Usage, metrics, connectors
  - name: webhooks
    description: Facebook webhook verification and receiver
security:
  - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: API key
      description: |
        Pulse API key (PULSE_API_KEY). In open dev mode (no key
        configured) the header is not required. Send
        `X-Pulse-Consumer: <name>` to identify the consumer; unknown
        names are rejected with 401 when consumers are configured.
  parameters:
    RequestIdHeader:
      name: x-request-id
      in: header
      description: Echoed in every JSON response body as `request_id`.
      schema:
        type: string
    ApiVersionHeader:
      name: x-pulse-api-version
      in: header
      description: Always `1` on JSON responses.
      schema:
        type: string
        enum: ["1"]
    ConsumerHeader:
      name: X-Pulse-Consumer
      in: header
      description: Registered consumer name (PULSE_CONSUMERS). Defaults to `default`.
      schema:
        type: string
        example: sando
  responses:
    BadRequest:
      description: The request was malformed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Missing/invalid API key, or unknown consumer.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: The consumer lacks the scope for this endpoint.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: No such route, or no such event id.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    RateLimited:
      description: Per-minute/per-day rate limit or per-consumer daily quota spent.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ServerError:
      description: Pulse failed to serve the request.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Error:
      type: object
      required: [error, code, message, request_id]
      properties:
        error:
          type: string
          example: rate_limited
        code:
          type: string
          example: rate_limited
        message:
          type: string
          example: Rate limit exceeded
        request_id:
          type: string
    QueryRequest:
      type: object
      required: [query]
      properties:
        query:
          type: string
          minLength: 1
          maxLength: 1000
          example: fuel shortage in Monrovia
        options:
          type: object
          properties:
            limit:
              type: integer
              minimum: 1
              maximum: 20
              default: 10
        context:
          type: object
          description: Forward-compatibility context; ignored by the server today. County is folded into the query text instead.
          properties:
            county:
              type: string
              example: Montserrado
            language:
              type: string
              example: koloqua
    Citation:
      type: object
      properties:
        title:
          type: string
        summary:
          type: string
          description: Extractive summary, max 280 chars.
        url:
          type: string
          format: uri
        source:
          type: object
          properties:
            name:
              type: string
            url:
              type: string
              format: uri
        published_at:
          type: string
          format: date-time
          nullable: true
        score:
          type: number
    QueryResponse:
      type: object
      required: [query, sufficient, confidence, results]
      properties:
        query:
          type: string
        answer:
          type: string
          nullable: true
          description: Extractive answer grounded in `results`; null when insufficient.
        sufficient:
          type: boolean
        insufficient_reason:
          type: string
          nullable: true
          example: no_documents_matched
        confidence:
          type: number
          minimum: 0
          maximum: 1
        results:
          type: array
          items:
            $ref: "#/components/schemas/Citation"
        events:
          type: array
          items:
            type: object
        timeline:
          type: array
          items:
            type: object
        path:
          type: string
          enum: [instant, fast, deep]
          description: "Execution path that served this response (Roadmap 6.1): instant = L1/L2 cache hit only; fast = memindex shortlist + store search; deep = research/compare/historical intents, whole candidate set + fuzzy second pass."
        latency_ms:
          type: number
          description: Measured server-side latency in milliseconds (fractional). Client-measured latency is higher (connection + the ~42 ms per-request floor on the dev VM — see docs/PERFORMANCE.md).
        routing_reason:
          type: string
          description: Why the router chose this path (e.g. l1_hit, l2_hit, default_fast, intent_deep, strategy_deep, semantic_only, stat_answer).
        stat_answer:
          type: object
          nullable: true
          description: |
            Stat answer (Roadmap 7.2), present only when the query
            is a statistics question answered from the knowledge
            store: kind (facility_count | population), sufficient,
            answer_text, value, unit, period, rows_counted, source,
            verified_at, insufficient_reason. Unknown places or
            facilities answer sufficient false — never a guessed number.
          properties:
            kind:
              type: string
            sufficient:
              type: boolean
            answer_text:
              type: string
              nullable: true
            value:
              type: number
              nullable: true
            unit:
              type: string
              nullable: true
            period:
              type: string
              nullable: true
            rows_counted:
              type: integer
            source:
              type: string
              nullable: true
            verified_at:
              type: string
              nullable: true
            insufficient_reason:
              type: string
              nullable: true
        query_plan:
          type: object
          properties:
            intent:
              type: string
            topics:
              type: array
              items:
                type: string
            counties:
              type: array
              items:
                type: string
            strategy:
              type: string
            classification_confidence:
              type: number
        meta:
          type: object
          properties:
            request_id:
              type: string
            results_count:
              type: integer
            sources_checked:
              type: integer
            generated_at:
              type: string
              format: date-time
    IngestRequest:
      type: object
      required: [title, text, url, source_id]
      properties:
        title:
          type: string
          maxLength: 500
        text:
          type: string
          maxLength: 20000
        url:
          type: string
          format: uri
        source_id:
          type: string
          description: Must name a registered source (see GET /v1/sources).
    IngestResponse:
      type: object
      properties:
        id:
          type: string
        source_id:
          type: string
        request_id:
          type: string
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          example: ok
        version:
          type: string
          example: "0.1.0"
        api_version:
          type: string
          example: "1"
        country:
          type: string
          example: lr
          description: Deployment country (PULSE_COUNTRY, ISO 3166-1 alpha-2).
        documents:
          type: integer
        sources_enabled:
          type: integer
        store:
          type: string
          enum: [memory, postgres]
        request_id:
          type: string
    UsageRow:
      type: object
      properties:
        consumer:
          type: string
        queries:
          type: integer
        ingests:
          type: integer
        quota_per_day:
          type: integer
        remaining:
          type: integer
    UsageResponse:
      type: object
      properties:
        day:
          type: string
          example: "2026-11-13"
        usage:
          type: array
          items:
            $ref: "#/components/schemas/UsageRow"
        request_id:
          type: string
paths:
  /v1/health:
    get:
      tags: [admin]
      summary: Health check (no auth)
      responses:
        "200":
          description: Pulse is up.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /v1/query:
    post:
      tags: [query]
      summary: Ask a question (auth + rate limit + quota, scope `query`)
      parameters:
        - $ref: "#/components/parameters/ConsumerHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QueryRequest"
      responses:
        "200":
          description: "Answer (possibly an honest refusal: sufficient is false)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueryResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"
  /v1/ingest:
    post:
      tags: [query]
      summary: Ingest one document manually (auth + rate limit + quota, scope `ingest`)
      parameters:
        - $ref: "#/components/parameters/ConsumerHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IngestRequest"
      responses:
        "201":
          description: Document stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"
  /v1/sources:
    get:
      tags: [intelligence]
      summary: Registered sources with document counts (no auth)
      responses:
        "200":
          description: Source list.
          content:
            application/json:
              schema:
                type: object
                properties:
                  sources:
                    type: array
                    items:
                      type: object
  /v1/sources/profiles:
    get:
      tags: [intelligence]
      summary: Source profiles, Trust & Intelligence Engine Phase 1 (no auth)
      parameters:
        - name: id
          in: query
          description: One profile by source id, with its history (unknown id is 404).
          schema:
            type: string
        - name: county
          in: query
          description: Filter by base county; must name one of the 15 counties (else 400).
          schema:
            type: string
        - name: status
          in: query
          description: Filter by profile status (else 400).
          schema:
            type: string
            enum: [active, under_review, restricted, removed]
      responses:
        "200":
          description: Profile list or single profile with history.
          content:
            application/json:
              schema:
                type: object
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/counties:
    get:
      tags: [intelligence]
      summary: All 15 counties with source counts, Phase 1 (no auth)
      responses:
        "200":
          description: County list (15 counties; every county except Montserrado is honestly zero until Phase 2).
          content:
            application/json:
              schema:
                type: object
  /v1/monitor:
    get:
      tags: [intelligence]
      summary: Live account monitoring, Phase 2 (no auth)
      parameters:
        - name: source
          in: query
          description: One source id for its single status (unknown id is 404).
          schema:
            type: string
        - name: channel
          in: query
          description: Filter by channel, rss or facebook (else 400).
          schema:
            type: string
      responses:
        "200":
          description: Per-source monitoring state (last check / success / new item, freshness, change detection, newest document) plus the Facebook connector state.
          content:
            application/json:
              schema:
                type: object
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/evidence:
    get:
      tags: [intelligence]
      summary: Claim evidence assessment, Phase 3 (no auth)
      parameters:
        - name: event
          in: query
          description: Event id whose own claim (its title) is assessed against its documents (unknown id is 404).
          schema:
            type: string
        - name: claim
          in: query
          description: Free-text claim; the store is searched for it and the claim assessed against what matched.
          schema:
            type: string
      responses:
        "200":
          description: The assessment (verified / corroborated / partially_confirmed / unconfirmed / disputed / outdated) with confidence, explanation, basis, supporting documents and contradiction flags. No "false" status — Pulse never issues verdicts.
          content:
            application/json:
              schema:
                type: object
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/claims:
    get:
      tags: [intelligence]
      summary: Claims extracted from one event, Phase 3 (no auth)
      parameters:
        - name: event
          in: query
          required: true
          description: Event id (unknown id is 404).
          schema:
            type: string
      responses:
        "200":
          description: The event's extracted claims (title + lead sentence, deduped), each with source, published time and URL.
          content:
            application/json:
              schema:
                type: object
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/sources/scores:
    get:
      tags: [intelligence]
      summary: Credibility scores, all sources, Phase 4 (no auth)
      responses:
        "200":
          description: Weighted credibility scores (accuracy 30%, corroboration 20%, evidence 15%, original reporting 10%, timeliness 10%, corrections 10%, local knowledge 5%) over the last 30 days, with rating 1-5 (null when provisional) and the basis for each component.
          content:
            application/json:
              schema:
                type: object
  /v1/rankings:
    get:
      tags: [intelligence]
      summary: Per-county source ranking, Phase 4 (no auth)
      parameters:
        - name: county
          in: query
          required: true
          description: County name (unknown county is 400).
          schema:
            type: string
      responses:
        "200":
          description: The county's registered sources ranked by credibility score, top 20. A county with no registered sources returns an empty list.
          content:
            application/json:
              schema:
                type: object
        "400":
          $ref: "#/components/responses/BadRequest"
  /v1/history:
    get:
      tags: [intelligence]
      summary: Historical event search, Phase 5 (no auth)
      parameters:
        - name: query
          in: query
          description: Substring of the event title or topic.
          schema:
            type: string
        - name: year
          in: query
          description: Year of first_seen, e.g. 2026.
          schema:
            type: integer
        - name: county
          in: query
          description: County name; an event counts when its documents mention it.
          schema:
            type: string
      responses:
        "200":
          description: Matching events with their counties, a monthly timeline, and the recurring (topic, county) groups among them.
          content:
            application/json:
              schema:
                type: object
        "400":
          $ref: "#/components/responses/BadRequest"
  /v1/history/similar:
    get:
      tags: [intelligence]
      summary: Events similar to one event, Phase 5 (no auth)
      parameters:
        - name: event
          in: query
          required: true
          description: Event id (unknown id is 404).
          schema:
            type: string
      responses:
        "200":
          description: Similar events (title similarity >= 0.5, or same topic in a shared county), most similar first.
          content:
            application/json:
              schema:
                type: object
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/actions:
    post:
      tags: [intelligence]
      summary: Run a plain-words action, Phase 6 (no auth)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                request:
                  type: string
                  example: "What is the latest from New Dawn?"
      responses:
        "201":
          description: The job, already done (or failed) with its result embedded.
          content:
            application/json:
              schema:
                type: object
        "400":
          $ref: "#/components/responses/BadRequest"
  /v1/actions/jobs:
    get:
      tags: [intelligence]
      summary: Poll an action job, Phase 6 (no auth)
      parameters:
        - name: id
          in: query
          required: true
          description: Job id, e.g. job-1 (unknown id is 404).
          schema:
            type: string
      responses:
        "200":
          description: The job with its kind, status and embedded result.
          content:
            application/json:
              schema:
                type: object
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/actions/watches:
    get:
      tags: [intelligence]
      summary: Standing watches, Phase 6 (no auth)
      responses:
        "200":
          description: Recorded watches. There is no push channel — the client re-checks this list.
          content:
            application/json:
              schema:
                type: object
  /v1/decisions:
    post:
      tags: [intelligence]
      summary: Decision Core assessment, Phase 7 (no auth)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                claim:
                  type: string
                  example: "Fuel shortage hits Monrovia"
      responses:
        "200":
          description: The claim's assessment with the full reasoning (the audit trail). Status is an assessment, never a verdict.
          content:
            application/json:
              schema:
                type: object
        "400":
          $ref: "#/components/responses/BadRequest"
  /v1/graph:
    get:
      tags: [intelligence]
      summary: Knowledge-graph subgraphs, Phase 7 (no auth)
      parameters:
        - name: event
          in: query
          description: Event id (unknown id is 404).
          schema:
            type: string
        - name: entity
          in: query
          description: Entity name (unknown entity is an empty graph).
          schema:
            type: string
        - name: kind
          in: query
          description: Entity kind filter (person, organization, county, city, topic, event, source, claim).
          schema:
            type: string
      responses:
        "200":
          description: The subgraph around the event or entity.
          content:
            application/json:
              schema:
                type: object
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/predictions:
    get:
      tags: [intelligence]
      summary: Per-topic predictions, Phase 8 (no auth)
      parameters:
        - name: topic
          in: query
          description: One topic (energy, economy, politics, society, health, sports, business); without it all known topics are analysed. An unknown topic comes back insufficient, never a 400.
          schema:
            type: string
        - name: county
          in: query
          description: Restrict to documents naming the county (unknown county is 400).
          schema:
            type: string
      responses:
        "200":
          description: Per-topic trend, forecast and monthly anomalies, with the disclaimer that a prediction is a statistical extrapolation, never a fact.
          content:
            application/json:
              schema:
                type: object
        "400":
          $ref: "#/components/responses/BadRequest"
  /v1/anomalies:
    get:
      tags: [intelligence]
      summary: Daily + monthly anomalies, Phase 8 (no auth)
      parameters:
        - name: topic
          in: query
          description: One topic; without it the daily anomalies cover all topics and the monthly ones cover every known topic.
          schema:
            type: string
      responses:
        "200":
          description: Daily anomalies (last 30 days, |z| >= 2) and monthly anomalies (R7.1 rule). An anomaly is a flag for a human to look at, never a verdict about why.
          content:
            application/json:
              schema:
                type: object
  /v1/risk:
    get:
      tags: [intelligence]
      summary: Per-county risk assessment, Phase 8 (no auth)
      parameters:
        - name: county
          in: query
          required: true
          description: The county to assess (missing or unknown county is 400).
          schema:
            type: string
        - name: topic
          in: query
          description: Restrict the anomaly and trend signals to one topic.
          schema:
            type: string
      responses:
        "200":
          description: Low / elevated / high with a score and plain-words reasons. An assessment of conditions, never a prediction of a specific event.
          content:
            application/json:
              schema:
                type: object
        "400":
          $ref: "#/components/responses/BadRequest"
  /v1/events:
    get:
      tags: [intelligence]
      summary: Latest clustered events, or one event's detail (no auth)
      parameters:
        - name: id
          in: query
          description: Event id for the detail view (documents, corroboration, status, conflicts, contradiction flags, timeline).
          schema:
            type: string
      responses:
        "200":
          description: Event list or event detail.
          content:
            application/json:
              schema:
                type: object
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/trends:
    get:
      tags: [intelligence]
      summary: Accelerating topics and geo trends (no auth)
      parameters:
        - name: window
          in: query
          description: Time window.
          schema:
            type: string
            enum: ["24h", "7d", "30d"]
            default: 24h
        - name: category
          in: query
          description: Topic category filter (e.g. `politics`, `entertainment`).
          schema:
            type: string
        - name: county
          in: query
          description: County filter for geo trends.
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            maximum: 50
            default: 10
      responses:
        "200":
          description: Trends, geo trends, monthly snapshots, forecasts and the social hashtag lane. Computed live from a store scan on every request, so `stale` is always false — the fields exist so every precomputed payload reports freshness the same way (Roadmap 6.4). The `social` section is empty until an authorized social connector feeds the registry (Roadmap 7.7).
          content:
            application/json:
              schema:
                type: object
        "400":
          description: "`window` was not 24h, 7d or 30d."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/briefing:
    get:
      tags: [intelligence]
      summary: Today's precomputed briefing, or a report variant (no auth)
      parameters:
        - name: scope
          in: query
          description: `daily` (default, worker-cached) or `weekly` (computed live).
          schema:
            type: string
            enum: ["daily", "weekly"]
            default: daily
        - name: kind
          in: query
          description: `general` (default), `political` or `economic` (computed live; Geez sections stay empty for political/economic).
          schema:
            type: string
            enum: ["general", "political", "economic"]
            default: general
        - name: county
          in: query
          description: County filter; a city in the county counts (a Monrovia story is a Montserrado story).
          schema:
            type: string
      responses:
        "200":
          description: Briefing for today (empty when no documents were collected today). `stale` is evaluated at serve time against the precompute TTL — a cached payload served hours after it was computed is honestly marked stale (Roadmap 6.4). Variants are computed live and never cached; an unknown scope/kind/county is a 400 (Roadmap 7.4).
          content:
            application/json:
              schema:
                type: object
        "400":
          description: "Unknown scope, kind, or county."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/forecast:
    get:
      tags: [intelligence]
      summary: Next-month topic predictions with confidence and basis (no auth)
      description: |
        Linear extrapolation over monthly aggregates (Roadmap 7.1).
        Every prediction is a statistical extrapolation, not a fact;
        topics with under 2 months of history are listed under
        `insufficient_history`, never predicted.
      parameters:
        - name: topic
          in: query
          description: Filter to one topic.
          schema:
            type: string
        - name: county
          in: query
          description: Filter to one county.
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
      responses:
        "200":
          description: Forecasts, anomalies (z-score spikes/drops) and insufficient-history topics.
          content:
            application/json:
              schema:
                type: object
  /v1/alerts:
    get:
      tags: [intelligence]
      summary: Breaking alerts, typed incidents (no auth)
      description: |
        Merged incidents from breaking events (Roadmap 7.3), computed
        live. Also published to the `pulse:alerts` Redis stream
        (consumer group `sando`). Empty is a real answer.
      responses:
        "200":
          description: Alerts plus stream name, group and availability.
          content:
            application/json:
              schema:
                type: object
  /v1/social:
    get:
      tags: [intelligence]
      summary: Social ingestion status — honestly empty until a connector is authorized (no auth)
      description: |
        The registry is fed only by authorized connector data
        (Roadmap 7.7, gated). Today no social connector is
        configured, so `social_available` is false and the lists are
        empty; each connector is listed with its unavailable reason.
        No scrapers, no faked posts.
      responses:
        "200":
          description: Social availability, post counts, top hashtags and connector statuses.
          content:
            application/json:
              schema:
                type: object
  /v1/locations:
    get:
      tags: [intelligence]
      summary: Seeded Liberian locations (no auth)
      parameters:
        - name: kind
          in: query
          description: Location kind filter (e.g. `city`, `county`, `district`).
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Locations with coordinates and provenance.
          content:
            application/json:
              schema:
                type: object
  /v1/statistics:
    get:
      tags: [intelligence]
      summary: Seeded Liberian statistics (no auth)
      responses:
        "200":
          description: Statistics with provenance.
          content:
            application/json:
              schema:
                type: object
  /v1/popular:
    get:
      tags: [intelligence]
      summary: Most-asked queries (no auth; Roadmap 6.4)
      description: >
        The queries users ask most, most-asked first. Only the query
        text and a count are ever recorded or exposed — no consumer,
        no identity. The list drives cache warming at boot.
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            maximum: 50
            default: 10
      responses:
        "200":
          description: Top queries with counts, plus how many distinct queries are tracked.
          content:
            application/json:
              schema:
                type: object
  /v1/autotune:
    get:
      tags: [admin]
      summary: Auto-tuning state (no auth; Roadmap 6.10)
      description: >
        Whether bounded auto-tuning is enabled, the live knob values
        it currently holds (L1 TTL, fan-out timeout, max concurrent
        sources), the configured precompute TTL (manual-only), the
        adjustment count, and the last adjustment with its reason.
        Names no secret.
      responses:
        "200":
          description: Auto-tuning state.
          content:
            application/json:
              schema:
                type: object
  /v1/admin/autotune/reset:
    post:
      tags: [admin]
      summary: Reset auto-tuning to configured defaults (auth; Roadmap 6.10)
      description: >
        Restores the configured defaults (L1 TTL, fan-out timeout,
        max concurrent sources) and applies them to the live knobs.
        API-key auth, no usage accounting. Returns the list of values
        that actually changed.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Reset applied, with the changed knobs.
          content:
            application/json:
              schema:
                type: object
        "401":
          description: Missing or invalid API key.
  /v1/admin/config:
    post:
      tags: [admin]
      summary: Hot-reload safe settings (auth; Roadmap 6.11)
      description: >
        Applies live values for L1 TTL (60-900s), fan-out timeout
        (50-500ms), and reindex interval (60-86400s). All values must
        be integers; unknown keys and out-of-range values are rejected
        with 400. Secrets, auth, rate limits, and retention are never
        accepted here. A manual L1 TTL / fan-out timeout becomes the
        auto-tuner's new baseline; the reindex interval is not tuned
        and holds until restart. API-key auth, no usage accounting.
        Returns the applied values.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Settings applied, with the applied values.
          content:
            application/json:
              schema:
                type: object
        "400":
          description: Unknown setting, non-integer value, out-of-range value, or no recognised settings.
        "401":
          description: Missing or invalid API key.
  /v1/quality:
    get:
      tags: [intelligence]
      summary: Intelligence quality report (no auth)
      responses:
        "200":
          description: Coverage, freshness and conflict quality metrics.
          content:
            application/json:
              schema:
                type: object
  /v1/usage:
    get:
      tags: [admin]
      summary: Per-consumer daily usage and quotas (auth, scope `admin`)
      parameters:
        - $ref: "#/components/parameters/ConsumerHeader"
        - name: consumer
          in: query
          description: Filter to one consumer.
          schema:
            type: string
      responses:
        "200":
          description: Today's usage rows.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsageResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
  /v1/connectors/facebook:
    get:
      tags: [admin]
      summary: Facebook connector status (no auth)
      description: |
        Returns `available: false` with the reason until a Meta app and
        authorized Page access are configured. Never returns invented data.
      responses:
        "200":
          description: Connector status.
          content:
            application/json:
              schema:
                type: object
        "503":
          description: Connector unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/webhooks/facebook:
    get:
      tags: [webhooks]
      summary: Meta subscription handshake (no API-key auth; verify token instead)
      description: |
        Meta GETs `?hub.mode=subscribe&hub.verify_token=...&hub.challenge=...`.
        Pulse echoes `hub.challenge` only when the token matches
        PULSE_FACEBOOK_VERIFY_TOKEN.
      parameters:
        - name: hub.mode
          in: query
          schema:
            type: string
        - name: hub.verify_token
          in: query
          schema:
            type: string
        - name: hub.challenge
          in: query
          schema:
            type: string
      responses:
        "200":
          description: The challenge string, plain text.
          content:
            text/plain:
              schema:
                type: string
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [webhooks]
      summary: Facebook webhook receiver (HMAC signature is the auth)
      description: |
        Requires `X-Hub-Signature-256` validated against
        PULSE_FACEBOOK_APP_SECRET. Validated notifications are recorded
        for the worker; the response counts received vs recorded.
      responses:
        "200":
          description: Received/recorded counts.
          content:
            application/json:
              schema:
                type: object
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          description: Webhooks not configured (no app secret).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /metrics:
    get:
      tags: [admin]
      summary: Prometheus metrics (no auth)
      responses:
        "200":
          description: Prometheus text exposition.
          content:
            text/plain:
              schema:
                type: string
